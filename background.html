<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>x3dom 배경 + 초록색 콘</title>
    <script src="https://www.x3dom.org/release/x3dom.js"></script>
    <link rel="stylesheet" href="https://www.x3dom.org/release/x3dom.css">
    <style>
        body { background-color: #222; }
    </style>
</head>
<body>
    <x3d width="1600px" height="1400px">
        <scene>
            <!-- 첫 번째 배경 -->
            <background id="bg1"
                skyAngle="0 0.5 1.57"
                skyColor="1 0 0, .6 .6 .8, .4 .4 .8"
                groundAngle=".5 1.57"
                groundColor=".2 .2 .7, .5 .5 .5, .2 .2 .2">
            </background>

            <!-- 두 번째 배경 -->
            <background id="bg2"
                skyAngle="0 1.57 3.14"
                skyColor="0 0 0, .2 .2 .2, .4 .4 .4">
            </background>

            <!-- 중앙 초록색 콘 -->
            <shape>
                <appearance>
                    <material diffuseColor="0 1 0"></material>
                </appearance>
                <cone height="2" bottomRadius="1"></cone>
            </shape>
        </scene>
    </x3d>
</body>
</html>
